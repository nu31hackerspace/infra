version: "3.8"

services:
  cron:
    image: crazymax/swarm-cronjob:1.14.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=UTC
    deploy:
      mode: global

  prune-nodes:
    image: docker:27.3.1-cli
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["docker", "system", "prune", "--all", "--force"]
    deploy:
      mode: global
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=25 * * * *"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:1.24.0
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://main.postgres.database.azure.com:5432/ferretdb?sslmode=require
      - FERRETDB_TELEMETRY=disable
      - FERRETDB_STATE_DIR=-
    networks:
      - mongo-rs-net
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M

  mongo-rs-viewer:
    image: haohanyang/compass-web:0.5.0
    depends_on:
      - ferretdb
    environment:
      - CW_MONGO_URI=mongodb://${USERNAME}:${PASSWORD}@ferretdb:27017/?authMechanism=PLAIN
      - CW_BASIC_AUTH_USERNAME=${USERNAME}
      - CW_BASIC_AUTH_PASSWORD=${PASSWORD}
    networks:
      - mongo-rs-net
      - reverse-proxy
    deploy:
      restart_policy:
        condition: on-failure

  mongo-rs-backup-weekly:
    image: ghcr.io/${OWNER_NAME}/mongo-rs-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - ferretdb
    environment:
      - MONGO_URI=mongodb://${USERNAME}:${PASSWORD}@ferretdb:27017/?authMechanism=PLAIN
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_SA_KEY_BASE64=${GCS_SA_KEY_BASE64}
      - GCS_FOLDER=gc-mongo-weekly
    networks:
      - mongo-rs-net
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=20 3 * * 2"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  caddy:
    image: ghcr.io/${OWNER_NAME}/caddy:${GIT_COMMIT_SHA}
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
      - "8448:8448"
    volumes:
      - caddy-data:/caddy_storage
    environment:
      - TZ=UTC
      - GRAFANA_HOST=${GRAFANA_HOST}
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
    networks:
      - reverse-proxy

  grafana:
    image: ghcr.io/${OWNER_NAME}/grafana:${GIT_COMMIT_SHA}
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - TZ=UTC
      - GF_SECURITY_ADMIN_USER=${USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.nu31.space
      - GF_AUTH_GITHUB_API_URL=https://api.github.com/user
      - GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS=["nu31hackerspace"]
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Editor
      # Read-only role of the "MQTT history" datasource, created by mqtt-logger.
      - MQTT_HISTORY_DB_USER=mqtt_history_reader
      - MQTT_HISTORY_DB_PASSWORD=${PASSWORD}
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
    networks:
      - reverse-proxy
      - mongo-rs-net
      - postgres-net
      - logs-net

  grafana-backup-daily:
    image: ghcr.io/${OWNER_NAME}/grafana-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - grafana
    environment:
      - GRAFANA_DATA_DIR=/var/lib/grafana/grafana.db
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_SA_KEY_BASE64=${GCS_SA_KEY_BASE64}
      - GCS_FOLDER=gc-grafana-daily
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 6 * * *"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  loki-init:
    image: alpine:3.21
    command:
      - sh
      - -c
      - |
        mkdir -p /loki/chunks /loki/rules /loki/rules-temp /loki/compactor /loki/wal
        chown -R 10001:10001 /loki
        echo "loki data dir ready"
    volumes:
      - loki-data:/loki
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

  loki:
    image: ghcr.io/${OWNER_NAME}/loki:${GIT_COMMIT_SHA}
    # Log storage for the whole swarm. Not published through caddy, only
    # grafana and the alloy collectors talk to it over logs-net.
    depends_on:
      - loki-init
    volumes:
      - loki-data:/loki
    environment:
      - TZ=UTC
    networks:
      - logs-net
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 1G

  alloy:
    image: ghcr.io/${OWNER_NAME}/alloy:${GIT_COMMIT_SHA}
    # Collects the logs of every container on the node and pushes them to loki.
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/rootfs:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys:/sys:ro
    environment:
      - TZ=UTC
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    networks:
      - logs-net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - prometheus-data:/prometheus
    networks:
      - logs-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
  mqtt:
    image: ghcr.io/${OWNER_NAME}/mqtt:${GIT_COMMIT_SHA}
    ports:
      - target: 8883
        published: 8883
        protocol: tcp
        mode: ingress
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
      # caddy-data mounted read-only so the entrypoint can read the TLS cert that
      # Caddy provisions and renews for MQTT_TLS_DOMAIN.
      - caddy-data:/caddy_storage:ro
    environment:
      - MQTT_PORT=1883
      - MQTT_TLS_PORT=8883
      - MQTT_TLS_DOMAIN=${MQTT_TLS_DOMAIN}
      - MQTT_ADMIN_USER=${USERNAME}
      - MQTT_ADMIN_PASSWORD=${PASSWORD}
    networks:
      - mqtt-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          memory: 256M

  mqtt-logger:
    image: ghcr.io/${OWNER_NAME}/mqtt-logger:${GIT_COMMIT_SHA}
    # Records every message of every topic into postgres (mqtt_store.mqtt_history)
    # and deletes messages older than RETENTION_HOURS. Browsable in Grafana on the
    # "MQTT history" dashboard.
    depends_on:
      - mqtt
    environment:
      - MQTT_URL=mqtt://mqtt:1883
      - MQTT_USER=${USERNAME}
      - MQTT_PASSWORD=${PASSWORD}
      # Azure Database for PostgreSQL. node-postgres reads PGSSLMODE, verify-full
      # checks the certificate against the system CAs, no CA file needed.
      - PGHOST=main.postgres.database.azure.com
      - PGPORT=5432
      - PGSSLMODE=verify-full
      - PGUSER=${USERNAME}
      - PGPASSWORD=${PASSWORD}
      - PGDATABASE=mqtt_store
      - RETENTION_HOURS=24
      - READER_USER=mqtt_history_reader
      - READER_PASSWORD=${PASSWORD}
    networks:
      - mqtt-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 256M

  mqtt-backup-daily:
    image: ghcr.io/${OWNER_NAME}/mqtt-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - mqtt
    environment:
      - MQTT_DATA_DIR=/mosquitto/data
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_SA_KEY_BASE64=${GCS_SA_KEY_BASE64}
      - GCS_FOLDER=gc-mqtt-daily
    volumes:
      - mqtt-data:/mosquitto/data:ro
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 4 * * *"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  wikijs:
    image: ghcr.io/requarks/wiki:2
    environment:
      - DB_TYPE=postgres
      - DB_HOST=main.postgres.database.azure.com
      - DB_PORT=5432
      - DB_SSL=true
      - DB_USER=${USERNAME}
      - DB_PASS=${PASSWORD}
      - DB_NAME=wikijs
    networks:
      - reverse-proxy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first

networks:
  reverse-proxy:
    driver: overlay
    attachable: true
  mongo-rs-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
  postgres-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
  mqtt-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
  logs-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  grafana-data:
  caddy-data:
  mqtt-data:
  mqtt-log:
  loki-data:
  alloy-data:
  prometheus-data:
