version: "3.8"

services:
  cron:
    image: crazymax/swarm-cronjob:1.14.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=UTC
    deploy:
      mode: global

  prune-nodes:
    image: docker:27.3.1-cli
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["docker", "system", "prune", "--all", "--force"]
    deploy:
      mode: global
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=25 * * * *"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:1.24.0
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://${USERNAME}:${PASSWORD}@main.postgres.database.azure.com:5432/ferretdb?sslmode=require
    networks:
      - mongo-rs-net
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M

  mongo-rs-viewer:
    image: haohanyang/compass-web:0.5.0
    depends_on:
      - ferretdb
    environment:
      - CW_MONGO_URI=mongodb://${USERNAME}:${PASSWORD}@ferretdb:27017/?authMechanism=PLAIN
      - CW_BASIC_AUTH_USERNAME=${USERNAME}
      - CW_BASIC_AUTH_PASSWORD=${PASSWORD}
    networks:
      - mongo-rs-net
      - reverse-proxy
    deploy:
      restart_policy:
        condition: on-failure

  caddy:
    image: ghcr.io/${OWNER_NAME}/caddy:${GIT_COMMIT_SHA}
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
      - "8448:8448"
    volumes:
      - caddy-data:/caddy_storage
    environment:
      - TZ=UTC
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
    networks:
      - reverse-proxy

  alloy:
    image: ghcr.io/${OWNER_NAME}/alloy:${GIT_COMMIT_SHA}
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      - TZ=UTC
      - GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL}
      - GRAFANA_LOKI_USER=${GRAFANA_LOKI_USER}
      - GRAFANA_PROMETHEUS_URL=${GRAFANA_PROMETHEUS_URL}
      - GRAFANA_PROMETHEUS_USER=${GRAFANA_PROMETHEUS_USER}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY}
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M

  mqtt:
    image: ghcr.io/${OWNER_NAME}/mqtt:${GIT_COMMIT_SHA}
    ports:
      - target: 8883
        published: 8883
        protocol: tcp
        mode: ingress
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
      - caddy-data:/caddy_storage:ro
    environment:
      - MQTT_PORT=1883
      - MQTT_TLS_PORT=8883
      - MQTT_TLS_DOMAIN=${MQTT_TLS_DOMAIN}
      - MQTT_ADMIN_USER=${USERNAME}
      - MQTT_ADMIN_PASSWORD=${PASSWORD}
    networks:
      - mqtt-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          memory: 512M

  mqtt-logger:
    image: ghcr.io/${OWNER_NAME}/mqtt-logger:${GIT_COMMIT_SHA}
    depends_on:
      - mqtt
    environment:
      - MQTT_URL=mqtt://mqtt:1883
      - MQTT_USER=${USERNAME}
      - MQTT_PASSWORD=${PASSWORD}
      - PGHOST=main.postgres.database.azure.com
      - PGPORT=5432
      - PGSSLMODE=verify-full
      - PGUSER=${USERNAME}
      - PGPASSWORD=${PASSWORD}
      - PGDATABASE=mqtt_store
      - RETENTION_HOURS=24
      - READER_USER=mqtt_history_reader
      - READER_PASSWORD=${PASSWORD}
    networks:
      - mqtt-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 256M

  mqtt-backup-daily:
    image: ghcr.io/${OWNER_NAME}/mqtt-backup:${GIT_COMMIT_SHA}
    command: ["/usr/local/bin/backup.sh"]
    depends_on:
      - cron
      - mqtt
    environment:
      - MQTT_DATA_DIR=/mosquitto/data
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_SA_KEY_BASE64=${GCS_SA_KEY_BASE64}
      - GCS_FOLDER=gc-mqtt-daily
    volumes:
      - mqtt-data:/mosquitto/data:ro
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 4 * * *"
        - "swarm.cronjob.skip-running=true"
      restart_policy:
        condition: none

  wikijs:
    image: ghcr.io/requarks/wiki:2
    environment:
      - DB_TYPE=postgres
      - DB_HOST=main.postgres.database.azure.com
      - DB_PORT=5432
      - DB_SSL=true
      - DB_USER=${USERNAME}
      - DB_PASS=${PASSWORD}
      - DB_NAME=wikijs
    networks:
      - reverse-proxy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first

networks:
  reverse-proxy:
    driver: overlay
    attachable: true
  mongo-rs-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
  mqtt-net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  caddy-data:
  mqtt-data:
  mqtt-log:
  alloy-data:
