apiVersion: 1

datasources:
  - name: MQTT history
    uid: mqtt-history
    type: grafana-postgresql-datasource
    access: proxy
    isDefault: false
    editable: false
    # Reachable over the postgres-net overlay network. The tables are created and
    # filled by the mqtt-logger service, which also creates the read-only role.
    url: postgres-1:5432
    user: ${MQTT_HISTORY_DB_USER}
    jsonData:
      database: mqtt_store
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${MQTT_HISTORY_DB_PASSWORD}
