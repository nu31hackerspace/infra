apiVersion: 1

# The direct MQTT datasource was removed together with its plugin. Provisioned
# datasources stay in the Grafana DB after their file is gone, so drop it explicitly.
deleteDatasources:
  - name: MQTT
    orgId: 1

datasources:
  - name: MQTT history
    uid: mqtt-history
    type: grafana-postgresql-datasource
    access: proxy
    isDefault: false
    editable: false
    # Azure Database for PostgreSQL. The tables are created and filled by the
    # mqtt-logger service, which also creates the read-only role.
    url: main.postgres.database.azure.com:5432
    user: ${MQTT_HISTORY_DB_USER}
    jsonData:
      database: mqtt_store
      sslmode: require
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: ${MQTT_HISTORY_DB_PASSWORD}
