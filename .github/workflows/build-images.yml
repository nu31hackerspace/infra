name: Build Images

# Builds every docker image of the infra.
#
# - on a pull request: builds only, to catch a broken Dockerfile before it is
#   merged into main and breaks the deploy.
# - called by the deploy workflow with `push: true`: builds and pushes the
#   images to ghcr.io.
#
# The image list lives here only, so both flows always build the same set.

on:
  pull_request:
  workflow_call:
    inputs:
      push:
        description: "Push the built images to the registry"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER_NAME: nu31hackerspace

jobs:
  build:
    strategy:
      # Keep building the other images when one fails, otherwise a single
      # broken Dockerfile hides the state of everything else.
      fail-fast: false
      matrix:
        include:
          - name: mongo-rs-backup
            context: ./mongo-rs-backup
            image: mongo-rs-backup
          - name: caddy
            context: ./caddy
            image: caddy
          - name: caddy-backup
            context: ./caddy-backup
            image: caddy-backup
          - name: grafana
            context: ./grafana
            image: grafana
          - name: grafana-backup
            context: ./grafana-backup
            image: grafana-backup
          - name: telegraf
            context: ./telegraf
            image: telegraf
          - name: loki
            context: ./loki
            image: loki
          - name: alloy
            context: ./alloy
            image: alloy
          - name: postgres-backup
            context: ./postgres-backup
            image: postgres-backup
          - name: mqtt
            context: ./mqtt
            image: mqtt
          - name: mqtt-backup
            context: ./mqtt-backup
            image: mqtt-backup

    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ inputs.push && 'and push ' || '' }}Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ inputs.push || false }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_NAME }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_NAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
