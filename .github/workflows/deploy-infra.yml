name: Deploy Infra

on:
  push:
    branches:
      - "main"

env:
  REGISTRY: ghcr.io
  DOCKER_STACK_NAME: infra
  HOST: ${{ vars.HOST }}
  GIT_COMMIT_SHA: ${{ github.sha }}
  OWNER_NAME: nu31hackerspace
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

  MQTT_TLS_DOMAIN: mqtt.nu31.space

  ROOT_SSH_PRIVATE_KEY: ${{ secrets.ROOT_SSH_PRIVATE_KEY }}

  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  GCS_SA_KEY_BASE64: ${{ secrets.GCS_SA_KEY_BASE64 }}

  GRAFANA_PROMETHEUS_URL: ${{ vars.GRAFANA_PROMETHEUS_URL }}
  GRAFANA_PROMETHEUS_USER: ${{ vars.GRAFANA_PROMETHEUS_USER }}
  GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}

jobs:
  # The image list lives in build-images.yml, shared with the pull request
  # build, so a PR always builds exactly what the deploy will push.
  build-and-push:
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create env file
        run: |
          write_var() { printf "%s='%s'\n" "$1" "$(printenv "$1")" >> ./envfile; }
          > ./envfile
          write_var OWNER_NAME
          write_var GIT_COMMIT_SHA
          write_var USERNAME
          write_var PASSWORD
          write_var GCS_BUCKET
          write_var GCS_SA_KEY_BASE64
          write_var MQTT_TLS_DOMAIN
          write_var GRAFANA_PROMETHEUS_URL
          write_var GRAFANA_PROMETHEUS_USER
          write_var GRAFANA_API_KEY

      # Dozzle login: one user, the shared USERNAME + PASSWORD. The password is
      # piped through stdin so it never shows up in the process list.
      - name: Generate Dozzle users file
        run: |
          printf '%s' "$PASSWORD" \
            | docker run -i --rm amir20/dozzle:v11.4.1 generate "$USERNAME" \
            > ./dozzle-users.yml
          grep -q "$USERNAME" ./dozzle-users.yml

      - name: Docker Stack Deploy
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ${{ env.DOCKER_STACK_NAME }}
          file: docker-stack.yml
          host: ${{ env.HOST }}
          user: ${{ env.USERNAME }}
          ssh_key: ${{ env.ROOT_SSH_PRIVATE_KEY }}
          env_file: ./envfile
          prune: true

